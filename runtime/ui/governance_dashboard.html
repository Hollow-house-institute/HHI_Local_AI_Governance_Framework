<html>
<head>
<title>HHI Governance Runtime Dashboard</title>
</head>
<body>
<h1>HHI Governance Runtime</h1>
<pre id="status"></pre>

<script>
fetch('/governance')
  .then(response => response.json())
  .then(data => {
    document.getElementById('status').innerText =
      JSON.stringify(data, null, 2);
  });
</script>
</body>
</html>
