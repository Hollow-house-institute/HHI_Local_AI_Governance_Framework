name: governance-check

on:
  push:
  pull_request:

jobs:
  governance-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify governance artifacts
        run: |
          test -f EXECUTION_TIME_GOVERNANCE_FOR_LOCAL_AI.md
          test -f STOP_AUTHORITY_MATRIX.md
          test -f AI_RISK_REGISTER.md
          test -f EDGE_RUNTIME_TELEMETRY_SCHEMA.json

      - name: Validate telemetry artifacts
        run: |
          test -f telemetry/governance_telemetry.jsonl
          test -f traces/interaction_trace.jsonl

      - name: Governance validation complete
        run: echo "Execution-Time Governance artifacts verified."
